services:
  app:
    build: .
    container_name: hi-conecta-rh
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/app/data/prod.db
      AUTH_TRUST_HOST: "true"
    volumes:
      - hi_conecta_data:/app/data
      - hi_conecta_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Proxy opcional — descomente se quiser Nginx na mesma stack
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: hi-conecta-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy

volumes:
  hi_conecta_data:
  hi_conecta_uploads:
